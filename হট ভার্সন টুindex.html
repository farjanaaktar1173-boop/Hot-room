<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hot Rooms — Live Now</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Outfit:wght@200..800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-0:#031215;
  --panel:#0a272d;
  --gold-1:#fff8dc;
  --gold-2:#f4dc8a;
  --gold-3:#d4af37;
  --gold-grad: linear-gradient(115deg,#fff8dc 0%,#f4dc8a 16%,#d4af37 34%,#8a6318 50%,#d4af37 66%,#f7e79c 84%,#fff8dc 100%);
  --teal:#20e3b2;
  --pink:#ff2a85;
  --text:#eaf6f6;
  --muted:#7fa3a6;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}

body{
  font-family:'Outfit','Hind Siliguri',sans-serif;
  background:
    radial-gradient(900px 600px at 50% -10%, #0d3b42 0%, transparent 60%),
    radial-gradient(700px 500px at 110% 100%, #123c33 0%, transparent 55%),
    #031215;
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow-x:hidden;
}

.app-container{
  width:100%;
  max-width:430px;
  min-height:100vh;
  position:relative;
  padding-bottom:40px;
  background:
    radial-gradient(600px 320px at 50% -5%, rgba(32,227,178,.10), transparent 65%),
    radial-gradient(500px 400px at 100% 40%, rgba(212,175,55,.06), transparent 60%),
    linear-gradient(180deg,#061c21 0%,#04161a 55%,#031114 100%);
  box-shadow:0 0 80px rgba(0,0,0,.8);
}

/* ============ TOP BAR ============ */
.top-bar{
  position:sticky;
  top:0;
  z-index:50;
  padding:18px 18px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(180deg, rgba(3,18,21,.96) 0%, rgba(3,18,21,.75) 70%, transparent 100%);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.back-btn{
  width:42px;height:42px;
  flex-shrink:0;
  display:grid;place-items:center;
  border-radius:14px;
  font-size:16px;
  color:#f4dc8a;
  background:linear-gradient(160deg, rgba(212,175,55,.15), rgba(212,175,55,.04));
  border:1px solid rgba(212,175,55,.4);
  cursor:pointer;
  transition:.25s;
}
.back-btn:hover{
  background:rgba(212,175,55,.25);
  box-shadow:0 0 16px rgba(212,175,55,.4);
  transform:translateX(-2px);
}

.page-title-wrap{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.15}
.page-title{
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--gold-grad);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldShift 7s ease infinite;
}
.page-title .fire{ -webkit-text-fill-color:initial; }
.page-sub{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.15em;
  text-transform:uppercase;
  font-weight:500;
  margin-top:2px;
}
@keyframes goldShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

.live-pill{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:#ffe0e0;
  background:rgba(255,77,77,.15);
  border:1px solid rgba(255,77,77,.35);
}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:#ff4d4d;
  box-shadow:0 0 0 0 rgba(255,77,77,.7);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,77,77,.65)}
  70%{box-shadow:0 0 0 7px rgba(255,77,77,0)}
  100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}
}

/* ============ SEARCH ============ */
.search-wrap{
  padding:0 18px 12px;
}
.search-bar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border-radius:16px;
  background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border:1px solid rgba(212,175,55,.22);
  transition:.25s;
}
.search-bar:focus-within{
  border-color:rgba(212,175,55,.7);
  box-shadow:0 0 20px rgba(212,175,55,.22);
}
.search-bar i{color:var(--gold-2); font-size:14px}
.search-bar input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-family:inherit;
  font-size:14px;
}
.search-bar input::placeholder{color:var(--muted)}

/* ============ STATS ============ */
.stats-row{
  display:flex;
  gap:10px;
  padding:0 18px 14px;
}
.stat-box{
  flex:1;
  padding:10px 12px;
  border-radius:14px;
  background:linear-gradient(160deg, rgba(32,227,178,.1), rgba(32,227,178,.02));
  border:1px solid rgba(32,227,178,.28);
  text-align:center;
}
.stat-box .num{
  font-size:18px;
  font-weight:800;
  color:#fff;
  line-height:1;
}
.stat-box .lbl{
  font-size:9.5px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:4px;
}

/* ============ GRID ============ */
.grid-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 16px;
}

.room-card{
  border-radius:22px;
  cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  animation:fadeUp .45s ease both;
}
.room-card:hover{
  transform:translateY(-5px);
  box-shadow:
    0 0 0 1px rgba(212,175,55,.10),
    0 22px 45px rgba(0,0,0,.6),
    0 0 34px rgba(212,175,55,.22);
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(12px)}
  to{opacity:1; transform:translateY(0)}
}

.gold-frame{
  position:relative;
  padding:1px;
  border-radius:22px;
  background:var(--gold-grad);
  background-size:220% 220%;
  animation:goldShift 8s ease infinite;
  box-shadow:
    0 0 0 1px rgba(212,175,55,.06),
    0 18px 40px rgba(0,0,0,.55),
    0 0 28px rgba(212,175,55,.10);
}

.card-inner{
  position:relative;
  border-radius:21px;
  overflow:hidden;
  background:#082024;
  aspect-ratio:1/1.12;
}

.card-inner img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
  filter:saturate(1.05) contrast(1.05);
}
.room-card:hover .card-inner img{transform:scale(1.07)}

.card-overlay{
  position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(3,18,21,.5) 0%, transparent 30%, transparent 40%, rgba(3,18,21,.94) 100%);
}

.card-top{
  position:absolute;
  top:9px; left:9px; right:9px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:6px;
}

.badge-mine{
  display:flex;align-items:center;gap:4px;
  font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:8px;
  color:#1a1405;
  background:var(--gold-grad);
  background-size:200% 200%;
  animation:goldShift 6s ease infinite;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
}
.badge-mine i{font-size:8px}

.badge-live{
  display:flex;align-items:center;gap:4px;
  font-size:8.5px;font-weight:700;letter-spacing:.1em;
  padding:4px 8px;border-radius:8px;
  color:#ffd9d9;
  background:rgba(200,30,30,.4);
  border:1px solid rgba(255,90,90,.5);
  backdrop-filter:blur(6px);
}
.badge-live i{font-size:5px}

/* rank badge for top rooms */
.badge-rank{
  position:absolute;
  top:-6px; right:-6px;
  width:26px; height:26px;
  border-radius:50%;
  display:grid; place-items:center;
  font-size:11px;
  font-weight:800;
  color:#1a1405;
  background:var(--gold-grad);
  background-size:200% 200%;
  animation:goldShift 6s ease infinite;
  box-shadow:0 3px 12px rgba(0,0,0,.6), 0 0 14px rgba(212,175,55,.55);
  z-index:3;
}

.room-info{
  position:absolute;
  left:0; right:0; bottom:0;
  padding:10px 11px 11px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.room-title{
  font-size:12.5px;
  font-weight:600;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.9);
}
.room-stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.tag{
  font-size:9px;
  font-weight:600;
  letter-spacing:.04em;
  padding:3px 8px;
  border-radius:999px;
  color:#f4dc8a;
  background:rgba(212,175,55,.15);
  border:1px solid rgba(212,175,55,.4);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:72px;
}
.count{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:10.5px;
  font-weight:700;
  color:var(--teal);
  text-shadow:0 0 10px rgba(32,227,178,.4);
}
.count i{font-size:9px}

/* ============ SKELETON ============ */
.skeleton{
  border-radius:22px;
  background:linear-gradient(110deg,#0a272d 8%,#0d3037 18%,#0a272d 33%);
  background-size:200% 100%;
  animation:shimmer 1.4s linear infinite;
  aspect-ratio:1/1.12;
  border:1px solid rgba(212,175,55,.10);
}
@keyframes shimmer{to{background-position:-200% 0}}

/* ============ EMPTY ============ */
.empty-state{
  grid-column:1 / -1;
  text-align:center;
  padding:60px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.empty-state .empty-icon{
  width:78px;height:78px;
  border-radius:50%;
  display:grid;place-items:center;
  font-size:30px;
  color:var(--gold-2);
  background:linear-gradient(160deg, rgba(212,175,55,.18), rgba(212,175,55,.03));
  border:1px solid rgba(212,175,55,.35);
  box-shadow:0 0 30px rgba(212,175,55,.18);
}
.empty-state h3{
  font-size:16px;
  color:#fff;
  font-weight:600;
}
.empty-state p{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.6;
  max-width:260px;
}

/* ============ TOAST ============ */
.toast{
  position:fixed;
  left:50%; bottom:30px;
  transform:translate(-50%, 20px);
  padding:11px 20px;
  border-radius:22px;
  background:rgba(10,39,45,.96);
  border:1px solid rgba(212,175,55,.5);
  color:#fff;
  font-size:12.5px;
  font-weight:500;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:500;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
  max-width:90%;
  text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%, 0);}

::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<div class="app-container">

  <!-- ===== TOP BAR ===== -->
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="page-title-wrap">
      <div class="page-title"><span class="fire">🔥</span> Hot Rooms</div>
      <div class="page-sub" id="pageSub">Loading...</div>
    </div>
    <div class="live-pill">
      <span class="live-dot"></span> Live
    </div>
  </div>

  <!-- ===== SEARCH ===== -->
  <div class="search-wrap">
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="নাম, দেশ বা রুম আইডি খুঁজুন...">
      <i class="fa-solid fa-xmark" id="clearSearch" style="cursor:pointer; display:none;"></i>
    </div>
  </div>

  <!-- ===== STATS ===== -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="num" id="statRooms">0</div>
      <div class="lbl">Active Rooms</div>
    </div>
    <div class="stat-box">
      <div class="num" id="statUsers">0</div>
      <div class="lbl">Live Listeners</div>
    </div>
    <div class="stat-box">
      <div class="num" id="statMine">0</div>
      <div class="lbl">Your Rooms</div>
    </div>
  </div>

  <!-- ===== GRID ===== -->
  <div class="grid-container" id="roomsGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

</div>

<div class="toast" id="toastBox"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
  authDomain: "room-7fbf7.firebaseapp.com",
  databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
  projectId: "room-7fbf7",
  storageBucket: "room-7fbf7.firebasestorage.app",
  messagingSenderId: "417946695868",
  appId: "1:417946695868:web:34c6f63269aaf659b2b8b9"
};
const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);

/* ---------- Constants ---------- */
const LINKS = {
  ownerRoom : "https://farjanaaktar1173-boop.github.io/Owner-room/",
  homepage  : "https://farjanaaktar1173-boop.github.io/Homepage/"
};

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = $("toastBox");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* =========================================================
   USER — লগইন ইনফো লোড (URL + localStorage + Auth)
   ========================================================= */
const me = { uid: "", name: "", photo: "", moiId: "" };
let meReady = false;

function readFromURL(){
  const p = new URLSearchParams(location.search);
  const uid = p.get("uid");
  if (!uid) return null;
  const data = {
    uid,
    name:  p.get("name")  || "",
    photo: p.get("photo") || "",
    moiId: p.get("moiId") || ""
  };
  history.replaceState({}, "", location.pathname);
  return data;
}

async function initMe(){
  let base = readFromURL();

  if (!base) {
    try {
      const s = localStorage.getItem("moi_user");
      if (s) base = JSON.parse(s);
    } catch(e){}
  }

  if (!base || !base.uid) {
    base = await new Promise(res => {
      const unsub = onAuthStateChanged(auth, u => {
        unsub();
        res(u ? { uid: u.uid, name: u.displayName || "User", photo: u.photoURL || "" } : null);
      });
    });
  }

  if (!base || !base.uid) return false;

  Object.assign(me, base);

  try {
    const snap = await get(ref(db, "users/" + me.uid));
    if (snap.exists()) {
      const u = snap.val();
      me.name  = u.name  || me.name;
      me.photo = u.photo || me.photo;
      me.moiId = u.moiId || me.moiId;
    }
  } catch(e){}

  meReady = true;
  return true;
}

/* =========================================================
   ROOMS LOAD + RENDER
   ========================================================= */
const grid = $("roomsGrid");
let allRooms = [];
let searchQuery = "";

function formatCount(n){
  n = Number(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(2).replace(/\.00$/,'') + 'M';
  if (n >= 1000)    return (n/1000).toFixed(2).replace(/\.00$/,'') + 'K';
  return String(n);
}

function roomCardHTML(room, rank){
  const title     = esc(room.name || "Untitled Room");
  const tag       = esc(room.country || "Room");
  const isMine    = meReady && room.ownerUid === me.uid;
  const listeners = Number(room.listeners || 0);
  const img       = room.logo || `https://picsum.photos/400/460?random=${encodeURIComponent(room.id)}`;

  const mineBadge = isMine
    ? `<span class="badge-mine"><i class="fa-solid fa-crown"></i> You</span>`
    : "";

  const rankBadge = (rank <= 3 && listeners > 0)
    ? `<div class="badge-rank">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉'}</div>`
    : "";

  return `
    <div class="room-card gold-frame" data-id="${esc(room.id)}">
      <div class="card-inner">
        ${rankBadge}
        <img src="${esc(img)}" alt="${title}" loading="lazy"
             onerror="this.onerror=null;this.src='https://picsum.photos/400/460?random=${encodeURIComponent(room.id)}'">
        <div class="card-overlay"></div>
        <div class="card-top">${mineBadge}<span class="badge-live"><i class="fa-solid fa-circle"></i>LIVE</span></div>
        <div class="room-info">
          <div class="room-title">${title}</div>
          <div class="room-stats">
            <span class="tag">${tag}</span>
            <span class="count"><i class="fa-solid fa-headphones"></i> ${formatCount(listeners)}</span>
          </div>
        </div>
      </div>
    </div>`;
}

function renderEmpty(msg, sub){
  grid.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon"><i class="fa-solid fa-satellite-dish"></i></div>
      <h3>${esc(msg)}</h3>
      <p>${esc(sub)}</p>
    </div>`;
}

function renderRooms(){
  const q = searchQuery.trim().toLowerCase();

  let list = allRooms;
  if (q) {
    list = allRooms.filter(r =>
      (r.name || "").toLowerCase().includes(q) ||
      (r.country || "").toLowerCase().includes(q) ||
      (r.id || "").toLowerCase().includes(q) ||
      (r.ownerName || "").toLowerCase().includes(q)
    );
  }

  if (!list.length){
    if (q) renderEmpty("কিছু পাওয়া যায়নি", "অন্য নাম বা দেশ দিয়ে খুঁজুন।");
    else   renderEmpty("এখনো কোনো রুম নেই", "হোম পেজ থেকে প্রথম রুম তৈরি করুন।");
    return;
  }

  grid.innerHTML = list.map((r, i) => roomCardHTML(r, i + 1)).join("");
}

/* ---------- room card click → owner room ---------- */
grid.addEventListener("click", (e) => {
  const card = e.target.closest(".room-card");
  if (!card) return;
  const id = card.dataset.id;
  if (!id) return;
  location.href = LINKS.ownerRoom + "?room=" + encodeURIComponent(id);
});

/* =========================================================
   REALTIME ROOMS LISTENER
   ========================================================= */
onValue(ref(db, "rooms"), (snap) => {
  const data = snap.val() || {};

  allRooms = Object.entries(data).map(([id, v]) => {
    const info = v?.info || {};
    const listeners = v?.listeners ? Object.keys(v.listeners).length : 0;
    const seats = v?.seats ? Object.values(v.seats).filter(s => s && s.uid).length : 0;

    return {
      id,
      name:      info.name    || "Untitled",
      logo:      info.logo    || null,
      country:   info.country || "",
      ownerUid:  info.owner?.uid || "",
      ownerName: info.owner?.name || "",
      ownerAvatar: info.owner?.avatar || "",
      createdAt: info.createdAt || 0,
      listeners
    };
  })
  // Sort: বেশি লিসনার উপরে, টাই হলে নতুন আগে
  .sort((a, b) => {
    if (b.listeners !== a.listeners) return b.listeners - a.listeners;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  // Stats
  $("statRooms").textContent = allRooms.length;
  $("statUsers").textContent = allRooms.reduce((sum, r) => sum + r.listeners, 0);
  $("statMine").textContent  = meReady ? allRooms.filter(r => r.ownerUid === me.uid).length : 0;

  $("pageSub").textContent = allRooms.length
    ? `${allRooms.length} live room${allRooms.length > 1 ? "s" : ""}`
    : "No rooms yet";

  renderRooms();
}, (err) => {
  console.error(err);
  renderEmpty("ডেটা লোড হয়নি", "ইন্টারনেট সংযোগ চেক করুন।");
});

/* =========================================================
   SEARCH
   ========================================================= */
$("searchInput").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  $("clearSearch").style.display = searchQuery ? "block" : "none";
  renderRooms();
});

$("clearSearch").addEventListener("click", () => {
  $("searchInput").value = "";
  searchQuery = "";
  $("clearSearch").style.display = "none";
  renderRooms();
});

/* =========================================================
   BACK
   ========================================================= */
window.goBack = function(){
  if (history.length > 1) history.back();
  else location.href = LINKS.homepage;
};

/* =========================================================
   INIT
   ========================================================= */
(async () => {
  await initMe();
  // Stats আবার হিসাব করি meReady হলে
  if (meReady) {
    $("statMine").textContent = allRooms.filter(r => r.ownerUid === me.uid).length;
    renderRooms();
  }
  console.log("%c🔥 Hot Rooms loaded", "color:#F5D76E;font-weight:bold;");
})();

</script>
